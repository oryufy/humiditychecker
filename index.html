
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="description" content="室内外の気温・湿度から、換気による水蒸気量と相対湿度の変化を確認します。">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>換気・湿度チェッカー</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="pwa-register.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>換気・湿度チェッカー</h1>
      <p>窓を開けると、空気はどう変わる？</p>
    </header>

    <section class="panel">
      <h2>室内</h2>
      <div class="input-grid">
        <label>
          気温（℃）
          <input id="indoorTemp" type="number"
                 min="-50" max="60" step="0.1" value="25">
        </label>
        <label>
          相対湿度（%）
          <input id="indoorRH" type="number"
                 min="0" max="100" step="1" value="60">
        </label>
      </div>
    </section>

    <section class="panel">
      <h2>屋外</h2>
      <div class="input-grid">
        <label>
          気温（℃）
          <input id="outdoorTemp" type="number"
                 min="-50" max="60" step="0.1" value="15">
        </label>
        <label>
          相対湿度（%）
          <input id="outdoorRH" type="number"
                 min="0" max="100" step="1" value="80">
        </label>
      </div>
      <button id="fetchWeather" type="button">
        現在地から屋外データを取得
    </button>
    <p class="hint" id="weatherStatus" role="status" aria-live="polite">
        ボタンを押すと、現在地の気温と湿度を取得します。
    </p>
    </section>

    <section class="panel results">
      <h2>水蒸気量</h2>
      <div class="comparison">
        <div>
          <span>室内</span>
          <strong id="indoorAH">--</strong>
          <small>g/m³</small>
        </div>
        <div>
          <span>屋外</span>
          <strong id="outdoorAH">--</strong>
          <small>g/m³</small>
        </div>
      </div>
      <p class="verdict" id="waterVerdict">計算中...</p>
      <p class="difference" id="waterDifference"></p>
    </section>

    <section class="panel results">
      <h2>換気後の相対湿度</h2>
      <p class="hint">
        屋外の空気が室内の温度まで暖まった場合の推定値です。
      </p>
      <div class="humidity-result">
        <strong id="estimatedRH">--</strong>
        <span>%</span>
      </div>
      <p class="verdict" id="humidityVerdict">計算中...</p>
    </section>

    <footer>
      <p>気温と湿度の入力値は自動計算に反映されます。</p>
    </footer>
  </main>
</body>
</html>
